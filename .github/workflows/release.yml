name: Release

# Publishes every non-private package under `packages/*` to npm. Push a version
# tag (`v0.1.0`) or run the workflow manually. Publishing needs the `NPM_TOKEN`
# repository secret; without it the checks run and the publish step is skipped.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  # Required for npm provenance, which the publish step opts into via
  # `NPM_CONFIG_PROVENANCE`.
  id-token: write

# Sourced once so the publish step can skip cleanly when the secret is absent;
# publishing without it would fail with a 401.
env:
  NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - run: pnpm install --frozen-lockfile

      # Never publish an unverified tree.
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm test

      # `pnpm release` builds, then publishes with `--access public`. pnpm
      # rewrites `workspace:^` peer ranges to real ranges as it packs, so it is
      # the only supported publisher here; `npm publish` would ship the
      # `workspace:` protocol verbatim.
      - name: Publish
        if: ${{ env.NPM_TOKEN != '' }}
        run: pnpm release
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: 'true'
